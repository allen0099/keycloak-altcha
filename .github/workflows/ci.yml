name: CI

on:
  push:
    branches: [main]
  pull_request:
  # lets a maintainer run CI on the release PR, which GITHUB_TOKEN-created PRs do not trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -DskipTests package
      - name: Start Keycloak with the jar and the test theme
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=keycloak.version -DforceStdout)
          echo "Keycloak $version"
          mkdir providers && cp target/keycloak-altcha-*.jar providers/
          docker run -d --name keycloak -p 127.0.0.1:8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/providers:/opt/keycloak/providers:ro" \
            -v "$PWD/src/it/theme/altcha-e2e:/opt/keycloak/themes/altcha-e2e:ro" \
            "quay.io/keycloak/keycloak:$version" start-dev
          for _ in $(seq 90); do
            curl -sf -o /dev/null http://127.0.0.1:8080/realms/master && exit 0
            sleep 2
          done
          exit 1
      - name: End-to-end test
        run: python3 src/it/e2e.py full --base-url http://127.0.0.1:8080 --admin-user admin --admin-password admin
      - name: Keycloak log
        if: always()
        run: docker logs keycloak
