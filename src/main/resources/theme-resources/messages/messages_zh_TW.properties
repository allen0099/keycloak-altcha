# Login pages
altchaFailed=驗證未通過，請等驗證框打勾後再送出一次。

# Admin console: authenticator config dialog (the admin UI reads the "messages" bundle too)
altchaEnabledLabel=啟用 ALTCHA 驗證
altchaEnabledHelp=關閉後這一步不出題也不檢查，其餘行為與內建步驟相同。
altchaDifficultyLabel=難度
altchaDifficultyHelp=解答開頭要有幾個 0（十六進位位數）。每加 1 運算量乘以 16，5 在桌機就要好幾秒，所以只開放 3、4；更細的調整用下面的雜湊次數。
altchaCostLabel=每次嘗試的雜湊次數
altchaCostHelp=微調難度用，1 到 1000，運算量與數值成正比（2 就是兩倍）。
altchaTtlLabel=題目有效秒數
altchaTtlHelp=頁面開著超過這個時間才送出，會被要求重新驗證。60 到 3600。
altchaServerUrlLabel=外部 ALTCHA 伺服器網址
altchaServerUrlHelp=你自己的 ALTCHA 伺服器出題網址，例如 https://sentinel.example.com/v1/challenge。瀏覽器小工具會向它取得新題目。留空則由 Keycloak 自行出題。
altchaApiKeyLabel=外部伺服器 API 金鑰
altchaApiKeyHelp=外部伺服器的公開金鑰（key_...）。網址若沒有 apiKey 參數，會自動附加。這個值可以安全地送到瀏覽器。
altchaSecretLabel=外部伺服器驗證金鑰
altchaSecretHelp=API 金鑰密鑰（sec_...），或你的伺服器簽題目用的 HMAC 金鑰。只留在 Keycloak 端，送出表單時用來驗證簽章，不會呼叫伺服器。設定伺服器網址時必填；未填則改用內建題目。
