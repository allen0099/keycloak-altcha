# Login pages
altchaFailed=Verification failed. Please wait for the check box to be ticked, then try again.

# Admin console: authenticator config dialog (the admin UI reads the "messages" bundle too)
altchaEnabledLabel=Enable ALTCHA
altchaEnabledHelp=When off, this step neither issues nor checks a challenge and behaves exactly like the built-in step.
altchaDifficultyLabel=Difficulty
altchaDifficultyHelp=Number of leading zero hex digits the solution must have. Each step multiplies the work by 16; 5 already takes seconds on a desktop, so only 3 and 4 are offered. Use the cost below for finer tuning.
altchaCostLabel=Hash iterations per attempt
altchaCostHelp=Fine-tunes the difficulty, 1 to 1000. Work grows linearly (2 means twice the work).
altchaTtlLabel=Challenge lifetime (seconds)
altchaTtlHelp=A page left open longer than this has to be verified again on submit. 60 to 3600.
altchaServerUrlLabel=External ALTCHA server URL
altchaServerUrlHelp=Challenge endpoint of your own ALTCHA server, for example https://sentinel.example.com/v1/challenge. The browser widget fetches new challenges from it. Leave empty to issue challenges inside Keycloak.
altchaApiKeyLabel=External server API key
altchaApiKeyHelp=Public API key (key_...) for the external server. It is added to the challenge URL as apiKey=... when the URL does not contain one. This value is safe to expose to browsers.
altchaSecretLabel=External server verification secret
altchaSecretHelp=API key secret (sec_...) or the HMAC key used by your server to sign challenges. It stays in Keycloak and verifies the submitted payload without calling the server. Required when a server URL is set; without it the built-in challenge is used.
altchaVerifyUrlLabel=External server verification URL
altchaVerifyUrlHelp=Endpoint of your ALTCHA server that checks a solved payload, for example https://gatecha.example.org/api/v1/verify. Keycloak sends the payload there after it has been checked, so the server knows about the verification and can refuse it. Leave empty to keep the server out of the loop.
