# Login pages
altchaFailed=Verification failed. Please wait for the check box to be ticked, then try again.

# Admin console: authenticator config dialog (the admin UI reads the "messages" bundle too)
altchaEnabledLabel=Enable ALTCHA
altchaEnabledHelp=When off, this step neither issues nor checks a challenge and behaves exactly like the built-in step.
altchaDifficultyLabel=Difficulty
altchaDifficultyHelp=Number of leading zero hex digits the solution must have. Each step multiplies the work by 16; 5 already takes seconds on a desktop, so only 3 and 4 are offered. Use the cost below for finer tuning.
altchaCostLabel=Hash iterations per attempt
altchaCostHelp=Fine-tunes the difficulty, 1 to 1000. Work grows linearly (2 means twice the work).
altchaTtlLabel=Challenge lifetime (seconds)
altchaTtlHelp=A page left open longer than this has to be verified again on submit. 60 to 3600.
